[package]
name = "jsondb-high-wasm"
version = "6.0.0"
edition = "2021"
description = "WASM fallback for jsondb-high — pure WebAssembly database engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
chrono = "0.4"
regex = "1.10"  

[profile.release]
opt-level = "s"       # Optimize for small WASM size
lto = true
strip = "debuginfo"
