# Native prebuild workflow for platforms we can't cross-compile on Linux.
# macOS: actual Apple hardware needed
# Windows: needs libnode.dll / MSVC toolchain
#
# Trigger: manual dispatch or on release tag push

name: Native Prebuilds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ── macOS ──────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            runner: macos-14
          - target: x86_64-apple-darwin
            arch: x64
            runner: macos-13

    runs-on: ${{ matrix.runner }}
    name: macOS ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package .node file
        run: |
          cp target/${{ matrix.target }}/release/libjsondb_high.dylib \
             index.darwin-${{ matrix.arch }}.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-darwin-${{ matrix.arch }}
          path: index.darwin-*.node

  universal-macos:
    needs: build-macos
    runs-on: macos-14
    name: macOS Universal

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prebuild-darwin-arm64
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: prebuild-darwin-x64
          path: .

      - name: Create universal binary
        run: |
          lipo -create \
            index.darwin-arm64.node \
            index.darwin-x64.node \
            -output index.darwin-universal.node

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-darwin-universal
          path: index.darwin-universal.node

  # ── Windows ────────────────────────────────────────────
  build-windows:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    runs-on: windows-latest
    name: Windows ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package .node file
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/jsondb_high.dll \
             index.win32-${{ matrix.arch }}-msvc.node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-win32-${{ matrix.arch }}
          path: index.win32-*.node
